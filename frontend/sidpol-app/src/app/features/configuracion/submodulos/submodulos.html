<div class="config-page">
  <h2 class="page-titulo">Submódulos</h2>

  <app-data-table
    [columnas]="columnas"
    [filas]="filtrados()"
    [cargando]="cargando()"
    [(busqueda)]="busqueda"
    textoAgregar="Agregar Sub Módulo"
    (agregar)="abrirAgregar()"
  >
    <ng-template appCelda="acciones" [appCeldaDe]="filtrados()" let-s>
      <button class="btn-icono" (click)="abrirEditar(s)">
        <i class="fa-solid fa-pen"></i>
      </button>
    </ng-template>
  </app-data-table>
</div>

@if (modalAbierto()) {
  <app-modal
    [titulo]="editando() ? 'Editar submódulos' : 'Agregar submódulos'"
    (cerrar)="cerrarModal()"
  >
    @if (estado.general()) {
      <div class="mensaje-error-general">{{ estado.general() }}</div>
    }

    <div class="campo">
      <label>Nombre*</label>
      <input
        type="text"
        [formControl]="form.controls.nombre_sm"
        (input)="estado.limpiar('nombre_sm')"
        [class.input-error]="estado.errores()['nombre_sm']"
        placeholder="Nombre*"
      />
      @if (estado.errores()['nombre_sm']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>
    <div class="campo">
      <label>Descripción*</label>
      <input
        type="text"
        [formControl]="form.controls.descripcion_sm"
        (input)="estado.limpiar('descripcion_sm')"
        [class.input-error]="estado.errores()['descripcion_sm']"
        placeholder="Descripción*"
      />
      @if (estado.errores()['descripcion_sm']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>
    <div class="campo">
      <label>Módulo*</label>
      <select
        [formControl]="form.controls.modulos_id_m"
        (change)="estado.limpiar('modulos_id_m')"
        [class.input-error]="estado.errores()['modulos_id_m']"
      >
        <option [ngValue]="null">Módulo*</option>
        @for (m of modulos(); track m.id_m) {
          <option [ngValue]="m.id_m">{{ m.nombre_m }}</option>
        }
      </select>
      @if (estado.errores()['modulos_id_m']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>

    <ng-container acciones>
      <button class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-guardar" (click)="guardar()">Guardar</button>
    </ng-container>
  </app-modal>
}
