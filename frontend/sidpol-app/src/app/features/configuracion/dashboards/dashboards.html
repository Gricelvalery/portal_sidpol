<div class="config-page">
  <h2 class="page-titulo">Dashboards</h2>

  <app-data-table
    [columnas]="columnas"
    [filas]="filtrados()"
    [cargando]="cargando()"
    [(busqueda)]="busqueda"
    textoAgregar="Agregar Dashboard"
    (agregar)="abrirAgregar()"
  >
    <ng-template appCelda="link" [appCeldaDe]="filtrados()" let-d>
      <a [href]="d.link_d" target="_blank" rel="noopener noreferrer" class="link-dashboard">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        Ver
      </a>
    </ng-template>
    <ng-template appCelda="acciones" [appCeldaDe]="filtrados()" let-d>
      <button class="btn-icono" (click)="abrirEditar(d)">
        <i class="fa-solid fa-pen"></i>
      </button>
    </ng-template>
  </app-data-table>
</div>

@if (modalAbierto()) {
  <app-modal
    [titulo]="editando() ? 'Editar Dashboard' : 'Agregar Dashboard'"
    (cerrar)="cerrarModal()"
  >
    @if (estado.general()) {
      <div class="mensaje-error-general">{{ estado.general() }}</div>
    }

    <div class="campo">
      <label>Nombre*</label>
      <input
        type="text"
        [(ngModel)]="form.nombre_d"
        (ngModelChange)="estado.limpiar('nombre_d')"
        [class.input-error]="estado.errores()['nombre_d']"
        placeholder="Nombre*"
      />
      @if (estado.errores()['nombre_d']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>
    <div class="campo">
      <label>Link*</label>
      <input
        type="text"
        [(ngModel)]="form.link_d"
        (ngModelChange)="estado.limpiar('link_d')"
        [class.input-error]="estado.errores()['link_d']"
        placeholder="https://..."
      />
      @if (estado.errores()['link_d']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>
    <div class="campo">
      <label>Submódulo*</label>
      <select
        [(ngModel)]="form.submodulos_id_sm"
        (ngModelChange)="estado.limpiar('submodulos_id_sm')"
        [class.input-error]="estado.errores()['submodulos_id_sm']"
      >
        <option [ngValue]="null">Seleccionar submódulo</option>
        @for (s of submodulos(); track s.id_sm) {
          <option [ngValue]="s.id_sm">{{ s.nombre_m }} — {{ s.nombre_sm }}</option>
        }
      </select>
      @if (estado.errores()['submodulos_id_sm']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>

    <ng-container acciones>
      <button class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-guardar" (click)="guardar()">Guardar</button>
    </ng-container>
  </app-modal>
}
