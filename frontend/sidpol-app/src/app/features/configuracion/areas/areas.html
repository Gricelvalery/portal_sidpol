<div class="config-page">
  <h2 class="page-titulo">Dependencias</h2>
  <app-data-table
    [columnas]="columnas"
    [filas]="filtradas()"
    [cargando]="cargando()"
    [(busqueda)]="busqueda"
    textoAgregar="Agregar Dependencia"
    (agregar)="abrirAgregar()">
    <ng-template appCelda="acciones" [appCeldaDe]="filtradas()" let-a>
      <button class="btn-icono" (click)="abrirEditar(a)">
        <i class="fa-solid fa-pen"></i>
      </button>
    </ng-template>
  </app-data-table>
</div>

@if (modalAbierto()) {
  <app-modal [titulo]="editando() ? 'Editar área' : 'Agregar área'" (cerrar)="cerrarModal()">
    @if (estado.general()) {
      <div class="mensaje-error-general">{{ estado.general() }}</div>
    }

    <div class="campo">
      <label>Nombre*</label>
      <input type="text" [(ngModel)]="form.nombre_area" (ngModelChange)="estado.limpiar('nombre_area')"
        [class.input-error]="estado.errores()['nombre_area']" placeholder="Nombre*"/>
      @if (estado.errores()['nombre_area']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>
    <div class="campo">
      <label>Descripción*</label>
      <input type="text" [(ngModel)]="form.descripcion_area" (ngModelChange)="estado.limpiar('descripcion_area')"
        [class.input-error]="estado.errores()['descripcion_area']" placeholder="Descripción*"/>
      @if (estado.errores()['descripcion_area']; as error) {
        <span class="mensaje-error">{{ error }}</span>
      }
    </div>

    <ng-container acciones>
      <button class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-guardar" (click)="guardar()">Guardar</button>
    </ng-container>
  </app-modal>
}
