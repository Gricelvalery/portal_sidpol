# Integración continua: lint, formato, pruebas, build y auditoría de dependencias.
# No necesita secretos ni base de datos (las pruebas simulan repositorios y servidor).
name: CI

on:
  push:
    branches: [main, mejora]
  pull_request:
    branches: [main, mejora]

# Solo lectura del repositorio
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Acciones fijadas por SHA de commit (la versión va en el comentario)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Pruebas (Jest + supertest)
        run: npm test

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría completa (informativa)
        run: npm audit
        continue-on-error: true

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sidpol-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/sidpol-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint + angular-eslint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Pruebas (Vitest)
        run: npx ng test --watch=false

      - name: Build de producción
        run: npx ng build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría completa (informativa)
        run: npm audit
        continue-on-error: true
